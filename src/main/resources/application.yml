spring:
  sql:
    init:
      mode: always
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_springboot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  ai:
    openai:
      chat:
        options:
          model: deepseek-v4-pro
          tool-calling:
            enabled: true
        completions-path: /v1/chat/completions
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}

server:
  port: 1236
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    path: ./uploads
    allowed-types: image/jpeg,image/png,image/gif,image/webp

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000
  header: Authorization
  token-prefix: "Bearer "